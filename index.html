<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Servicios</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#4c5ef0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control S.S.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #4c5ef0 0%, #6366f1 50%, #818cf8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      color: white;
      padding: 2rem;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; opacity: 0.85; margin-bottom: 2rem; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    .btn {
      display: inline-block;
      background: white;
      color: #4c5ef0;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  </style>
</head>
<body>
  <div class="container">
    <img src="icon-192.png" alt="Control de Servicios" class="icon">
    <h1>Control de Servicios</h1>
    <div class="spinner" id="spinner"></div>
    <a href="https://script.google.com/a/macros/serviciosnea.com.ar/s/AKfycbxk9VfDUWNxYyevtKDSnGSB3B4kovCIyVJAS3EIpub13JBwA98wqEg9_awDgGV76GtbDw/exec" class="btn" id="btnAbrir">Abrir Aplicaci&#243;n</a>
  </div>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(reg) { console.log('SW registered:', reg.scope); })
        .catch(function(err) { console.log('SW error:', err); });
    }

    // Auto-redirect after 3 seconds
    var URL_APP = 'https://script.google.com/a/macros/serviciosnea.com.ar/s/AKfycbxk9VfDUWNxYyevtKDSnGSB3B4kovCIyVJAS3EIpub13JBwA98wqEg9_awDgGV76GtbDw/exec';
    setTimeout(function() {
      window.location.href = URL_APP;
    }, 3000);
  </script>
</body>
</html>
